<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050a0d"><title>THE SILENT ARCHIVE</title><link rel="stylesheet" href="./style.css"></head><body>
<canvas id="universe" aria-label="スクロールで下方へ移動する宇宙空間"></canvas><div id="fallback" class="fallback" hidden>この環境では3D表示を利用できません。</div><div class="vignette" aria-hidden="true"></div>
<svg class="instrumentation" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true"><g class="instrument-lines"><path d="M0 170 H92 L126 205 H190"/><path d="M1000 500 H910 L876 464 H817"/><path d="M0 530 H66 L91 506 H138"/><path d="M1000 135 H940 L910 165 H858"/></g><g class="instrument-marks"><path d="M94 152 v36 M82 170 h24 M905 482 v36 M893 500 h24"/><path d="M190 201 v8 M817 460 v8 M138 502 v8 M858 161 v8"/></g></svg>
<div class="viewport-ui"><div class="topline"><span class="mark" aria-hidden="true">◌</span><button id="settingsBtn" class="icon-button" aria-label="設定を開く">⚙</button></div><div class="left-edge" aria-hidden="true"><span>01</span><div class="edge-line"><i id="progressBar"></i></div><span>∞</span></div><div class="bottomline"><span class="scroll-indicator" aria-hidden="true">↓</span><button class="icon-button" id="restart" aria-label="最初に戻る">↟</button></div></div>
<main aria-label="スクロールして空間の下方へ移動する"><div class="journey" aria-hidden="true"></div></main><div id="objects" class="object-layer" aria-label="空間内のオブジェクト"></div><div class="cursor-light" id="cursorLight" aria-hidden="true"></div>
<div class="sector-indicator" id="sectorIndicator" aria-live="polite" hidden><span>OBSERVATION POINT</span><strong>02</strong><button id="sectorBack" aria-label="元の場所に戻る">←</button></div>
<dialog id="record" class="record-dialog" aria-labelledby="recordTitle"><div class="record-top"><span>ARCHIVE / FIELD NOTE</span><button id="recordClose" aria-label="資料を閉じる">×</button></div><div class="record-number">01 <span> / </span> 03</div><div class="record-symbol" aria-hidden="true">◌</div><p class="record-kicker">RECOVERED FRAGMENT</p><h1 id="recordTitle">途切れた観測</h1><div class="record-divider"></div><p class="record-body">漂う構造物のあいだに、微かな反応を確認。<br>観測光の中にだけ、別の輪郭が現れた。</p><p class="record-body">近づくたび、重なっていた破片が離れていく。<br>これらが何の一部だったのかは分からない。</p><div class="record-meta"><span>分類 / 観測記録</span><span>出所 / 不明</span></div></dialog>
<dialog id="settings"><form method="dialog"><div class="dialog-top"><span>設定</span><button aria-label="閉じる">×</button></div><label>描画品質 <select id="quality"><option value="standard">通常</option><option value="high">高品質</option><option value="low">軽量</option></select></label><label>動きを抑える <input id="motion" type="checkbox"></label><button class="close-button">閉じる</button></form></dialog><script src="./vendor/gsap.min.js"></script><script type="module" src="./main.js"></script></body></html>
